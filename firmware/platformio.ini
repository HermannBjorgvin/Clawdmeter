[env:waveshare_amoled_216]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
upload_speed = 921600
monitor_speed = 115200

; Compile shared code + this board's per-board folder; exclude all other
; boards. New ports add a `+<boards/<name>/>` line in their own env block.
build_src_filter =
    +<*>
    -<boards/>
    +<boards/waveshare_amoled_216/>

build_flags =
    ; env name reported by the `info` serial command (build_info.h)
    -DCLAWD_ENV=\"${this.__env__}\"
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; AXP2101 PMU
    -DXPOWERS_CHIP_AXP2101
    ; NimBLE config — peripheral, 2 simultaneous connections so the OS can
    ; hold the HID link (Space key from BOOT button) while the app holds
    ; its own connection for the custom data service.
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    ; Peripheral Preferred Connection Parameters (GAP 0x2A04) — the accessory's
    ; steady-state preference per Microsoft's Bluetooth accessory guidelines:
    ; interval 15-30ms (HID-snappy), latency 0, supervision timeout 6s.
    ; Captured on hardware: Windows honors a long timeout (9.6s) while only its
    ; HID driver holds the link, but clamps to 2s whenever an app GATT session
    ; (the app) is active — PPCP documents our preference and governs the
    ; HID-only steady state; it does NOT override that 2s clamp. Units:
    ; interval ×1.25ms, timeout ×10ms. Windows caches GATT per bond, so a
    ; re-pair is needed for changes here to be seen.
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_MIN_CONN_INTERVAL=12
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_MAX_CONN_INTERVAL=24
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_SLAVE_LATENCY=0
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_SUPERVISION_TMO=600
    ; LVGL config via build flags
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1
    ; Refresh + animation timer period (LVGL default 33 ms = 30 fps cap).
    ; See docs/clawd-director.md "Frame rate" before changing per board.
    -DLV_DEF_REFR_PERIOD=16
    -DLV_USE_SNAPSHOT=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.6
    lewisxhe/SensorLib@^0.2.6
    lewisxhe/XPowersLib@^0.2.7
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^2.1.1


