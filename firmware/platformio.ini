; 4-wire SPI + XPT2046 resistive touch. Classic ESP32-D0WD: dual-core Xtensa,
; 4 MB flash, NO PSRAM, CH340 USB-UART (a real serial port, not the native
; USB-JTAG the S3/C6 boards use).
;
; 4 MB with the stock partition table leaves ~1.25 MB for the app, which this
; firmware (~1.65 MB, mostly the splash animation tables) overflows; huge_app
; gives it 3 MB and drops OTA, which this board does not use.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
