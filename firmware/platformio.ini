upload_speed = 460800
monitor_speed = 115200

build_src_filter =
    +<*>
    -<boards/>
    +<boards/esp32_2432s028r/>

build_flags =
    ; env name reported by the `info` serial command (build_info.h)
    -DCLAWD_ENV=\"${this.__env__}\"
    ; No -DBOARD_HAS_PSRAM: the CYD has none. Shared code gates on this to
    ; use MALLOC_CAP_INTERNAL, shrink the LVGL strips, take the direct-draw
    ; splash path, and fall back to the static corner mascot.
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    ; Peripheral Preferred Connection Parameters -- see the waveshare_amoled_216
    ; env for the full rationale (Windows supervision-timeout churn fix).
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_MIN_CONN_INTERVAL=12
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_MAX_CONN_INTERVAL=24
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_SLAVE_LATENCY=0
    -DMYNEWT_VAL_BLE_SVC_GAP_PPCP_SUPERVISION_TMO=600
    ; LVGL config via build flags
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1
    ; Refresh + animation timer period (LVGL default 33 ms = 30 fps cap).
    ; See docs/clawd-director.md "Frame rate" before changing per board.
    -DLV_DEF_REFR_PERIOD=16
    ; Screenshot capture needs a full-frame RGB565 buffer in internal SRAM,
    ; which this board has no room for. send_screenshot prints
    ; SCREENSHOT_UNSUPPORTED: QA this port by eye, like the C6 ports.
    -DLV_USE_SNAPSHOT=0

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.4
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^2.1.1


